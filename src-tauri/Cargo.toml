[package]
name = "stream-companion"
version = "1.1.4"
description = "DisCrab - Ultra-lightweight P2P screen & audio streaming with WASAPI process loopback and Android DSP"
authors = ["DisCrab Team"]
edition = "2021"
default-run = "stream-companion"

[lib]
name = "stream_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
rand = "0.8"
regex = "1.10"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2.0"
local-ip-address = "0.6"

[target.'cfg(windows)'.dependencies]
scrap = "0.5"
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
] }
