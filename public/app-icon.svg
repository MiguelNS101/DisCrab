  <path d="M218 184.5C218 175.8 227.5 170.4 235 174.9L316.5 224.4C323.7 228.8 323.7 239.2 316.5 243.6L235 293.1C227.5 297.6 218 292.2 218 283.5V184.5Z" fill="url(#playGrad)" />

