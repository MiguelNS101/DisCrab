name: Compilar Executável Windows (StreamCompanion)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar StreamCompanion (.exe) Windows
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🦀 Instalar Rust Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: ⚡ Cache do Cargo e Build do Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 📦 Instalar Dependências do Frontend
        run: npm install

      - name: 🔨 Compilar Frontend Vite (React + Tailwind)
        run: npm run build

      - name: 🚀 Compilar Executável Nativo Windows via Tauri v2 CLI
        run: npx @tauri-apps/cli build

      - name: 📤 Publicar Artefato do Executável (.exe e instalador)
        uses: actions/upload-artifact@v4
        with:
          name: StreamCompanion-Windows-Release
          path: |
            src-tauri/target/release/StreamCompanion.exe
            src-tauri/target/release/stream-companion.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: 🏷️ Criar Release no GitHub (se for tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/StreamCompanion.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
