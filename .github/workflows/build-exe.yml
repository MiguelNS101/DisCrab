name: Compilar DisCrab (Windows .exe + Android .apk)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar Release no GitHub com os arquivos .exe e .apk?'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Nome da Tag da Release (ex: v1.1.6)'
        required: false
        type: string
        default: 'v1.1.6'

# Permissão obrigatória para que o GitHub Actions consiga criar Releases e fazer upload de binários
permissions:
  contents: write

jobs:
  test-suite:
    name: 🧪 Testes Pré-Compilação (Conexão P2P e Áudio DSP)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🥟 Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Instalar Dependências e Rodar Testes de Conexão e Áudio (Frontend/TS)
        run: |
          bun install
          bun run test
          bun run lint

  build-windows:
    name: 🪟 Compilar DisCrab (.exe) Windows
    needs: test-suite
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🥟 Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🦀 Instalar Rust Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: ⚡ Cache do Cargo e Build do Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 📦 Instalar Dependências do Frontend e Gerar Ícones DisCrab
        shell: pwsh
        run: |
          bun install
          bun add -d @rolldown/binding-win32-x64-msvc@1.2.14
          node scripts/generate-icons.mjs

      - name: 🧪 Executar Testes Nativos Rust (Sinalização P2P, Áudio WASAPI e Android DSP)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 🧪 Executar Testes Pré-Compilação e Compilar Frontend Vite
        run: bun run build

      - name: 🚀 Compilar Executável Nativo Windows via Tauri v2 CLI
        run: npx @tauri-apps/cli build

      - name: 📂 Preparar Binários Windows (.exe / .msi) para Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets_windows
          
          # Copia executável standalone direto
          $exeFiles = Get-ChildItem -Path src-tauri/target/release -Filter "*.exe" -File
          foreach ($file in $exeFiles) {
            if ($file.Name -notlike "*build*" -and $file.Name -notlike "*tauri*") {
              Write-Host "Encontrado executavel: $($file.FullName)"
              Copy-Item -Path $file.FullName -Destination "release_assets_windows/DisCrab-Portable.exe" -Force
            }
          }
          
          # Copia instaladores NSIS e MSI se gerados
          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.exe" -Destination "release_assets_windows/" -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "src-tauri/target/release/bundle/msi") {
            Copy-Item -Path "src-tauri/target/release/bundle/msi/*.msi" -Destination "release_assets_windows/" -Force -ErrorAction SilentlyContinue
          }
          
          Write-Host "Arquivos Windows prontos em release_assets_windows:"
          Get-ChildItem -Path release_assets_windows

      - name: 📤 Publicar Artefato Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: DisCrab-Windows-Binaries
          path: release_assets_windows/
          if-no-files-found: warn

  build-android:
    name: 🤖 Compilar DisCrab (.apk) Android
    needs: test-suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configurar Android SDK e NDK (Direto via sdkmanager sem pacote obsoleto 'tools')
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name "sdkmanager" | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Erro: sdkmanager não encontrado em $ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Usando sdkmanager: $SDKMANAGER"
          
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          LLVM_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android24-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$LLVM_BIN/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_aarch64_linux_android=$LLVM_BIN/llvm-ranlib" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LLVM_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$LLVM_BIN" >> $GITHUB_PATH

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🥟 Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🦀 Instalar Rust Toolchain com Targets Android (ARM64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: ⚡ Cache do Cargo e Gradle Android
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.gradle/caches/
            src-tauri/target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: 📦 Instalar Dependências do Frontend, Gerar Ícones e Compilar Dist
        run: |
          bun install
          node scripts/generate-icons.mjs
          bun run build

      - name: 🚀 Inicializar Projeto Android Tauri v2 e Compilar APK (ARM64)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx @tauri-apps/cli android init --ci || npx @tauri-apps/cli android init
          fi
          npx @tauri-apps/cli icon src-tauri/icons/icon.png || true
          
          # Habilita tráfego WebSocket LAN substituindo o placeholder existente (sem duplicar atributo XML)
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/android:usesCleartextTraffic="${usesCleartextTraffic}"/android:usesCleartextTraffic="true"/g' "$MANIFEST_PATH" || true
          fi
          
          GRADLE_PROPS="src-tauri/gen/android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            echo "" >> "$GRADLE_PROPS"
            echo "android.suppressUnsupportedCompileSdk=36" >> "$GRADLE_PROPS"
          fi
          
          npx @tauri-apps/cli android build --apk --target aarch64 --ci

      - name: 🔏 Assinar e Preparar APK Instalável para Release
        run: |
          mkdir -p release_assets_android
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erro: Nenhum arquivo .apk encontrado após o build!"
            exit 1
          fi
          echo "APK encontrado em: $APK_PATH"
          
          # Gera keystore de assinatura caso o APK seja unsigned para permitir instalação direta no celular Android
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias discrab -storepass discrab123 -keypass discrab123 \
            -dname "CN=DisCrab, OU=P2P, O=MiguelNS101, L=BR, S=SP, C=BR"
          
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$APK_PATH" aligned.apk || cp "$APK_PATH" aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release-key.jks \
            --ks-key-alias discrab --ks-pass pass:discrab123 \
            --key-pass pass:discrab123 \
            --out "release_assets_android/DisCrab-Android.apk" aligned.apk
          
          ls -lh release_assets_android/

      - name: 📤 Publicar Artefato Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: DisCrab-Android-APK
          path: release_assets_android/
          if-no-files-found: warn

  publish-release:
    name: 🏷️ Publicar Release Unificada (.exe + .apk)
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar Binários Windows (.exe)
        uses: actions/download-artifact@v4
        with:
          name: DisCrab-Windows-Binaries
          path: release_assets/

      - name: 📥 Baixar Pacote Android (.apk)
        uses: actions/download-artifact@v4
        with:
          name: DisCrab-Android-APK
          path: release_assets/

      - name: 📋 Listar Arquivos da Release
        run: ls -lh release_assets/

      - name: 🚀 Criar ou Atualizar Release no GitHub (.exe + .apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event.inputs.release_tag || 'v1.1.4') }}
          name: DisCrab ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event.inputs.release_tag || 'v1.1.4') }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
